            description: Item ETag, "i-N".
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LookupItemRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
          description: OK
          headers:
            ETag:
              schema:
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "404":
          content:
            application/problem+json:
              schema:
