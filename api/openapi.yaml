components:
  schemas:
    BlockingParent:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
      required:
        - type
        - id
        - name
      type: object
    BookSuggestion:
      additionalProperties: false
      properties:
        authors:
          description: The authors joined with a comma; empty when Open Library lists none.
          type: string
        cover_url:
          description: For suggestion display only, not an item image.
          format: uri
          type:
            - string
            - "null"
        isbn:
          description: The first 13-digit ISBN of the work's editions, else the first ISBN.
          type:
            - string
            - "null"
        pages:
          description: Median number of pages over the work's editions.
          format: int64
          type:
            - integer
            - "null"
        source_id:
          description: The Open Library work id.
          pattern: ^OL[0-9]+W$
          type: string
        title:
          type: string
        year:
          description: First publication year.
          format: int64
          type:
            - integer
            - "null"
      required:
        - authors
        - cover_url
        - isbn
        - pages
        - source_id
        - title
        - year
      type: object
    BookSuggestions:
      additionalProperties: false
      properties:
        available:
          type: boolean
        results:
          items:
            $ref: "#/components/schemas/BookSuggestion"
          type: array
      required:
        - available
        - results
      type: object
    Content:
      additionalProperties: false
      properties:
        body:
          description: Markdown source, up to 1 MiB UTF-8.
          type: string
        item_id:
          format: uuid
          type: string
        updated_at:
          description: When this version was saved. null for version 0.
          format: date-time
          type:
            - string
            - "null"
        version:
          description: 0 = never saved.
          format: int64
          minimum: 0
          type: integer
      required:
        - item_id
        - version
        - body
        - updated_at
      type: object
    ContentVersionInfo:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        size_bytes:
          format: int64
          minimum: 0
          type: integer
        version:
          format: int64
          type: integer
      required:
        - created_at
        - size_bytes
        - version
      type: object
    ContentVersionList:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/ContentVersionInfo"
          type: array
      required:
        - data
      type: object
    CreateFolderRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 200
          minLength: 1
          type: string
        parent_folder_id:
          format: uuid
          type:
            - string
            - "null"
      required:
        - name
      type: object
    CreateItemRequest:
      additionalProperties: false
      properties:
        lookup:
          description: For movie, TV and book lists, run lookup during creation. Ignored on other types.
          type: boolean
        metadata:
          additionalProperties: {}
          type: object
        price:
          $ref: "#/components/schemas/PriceInput"
        source_id:
          description: Optional selected Open Library work id. Used only when lookup runs on a book item.
          type: string
        title:
          type: string
        tmdb_id:
          description: Optional selected TMDB suggestion. Used only when lookup runs on a movie or TV item.
          format: int64
          type: integer
        website:
          type:
            - string
            - "null"
      type: object
    CreateListRequest:
      additionalProperties: false
      properties:
        description:
          type:
            - string
            - "null"
        display_mode:
          type:
            - string
            - "null"
        folder_id:
          format: uuid
          type:
            - string
            - "null"
        icon:
          type:
            - string
            - "null"
        icon_color:
          type:
            - string
            - "null"
        name:
          type: string
        pinned_fields:
          items:
            type: string
          type:
            - array
            - "null"
        sort_mode:
          type:
            - string
            - "null"
        type:
          type:
            - string
            - "null"
      required:
        - name
      type: object
    CreateTypeFieldRequest:
      additionalProperties: false
      properties:
        label:
          type: string
        type:
          type: string
      required:
        - label
        - type
      type: object
    CreateTypeRequest:
      additionalProperties: false
      properties:
        allows_price:
          type: boolean
        default_icon:
          type:
            - string
            - "null"
        default_pinned_fields:
          items:
            type: string
          type:
            - array
            - "null"
        default_sort_field:
          type:
            - string
            - "null"
        name:
          type: string
      required:
        - name
      type: object
    FieldError:
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
      required:
        - field
        - message
      type: object
    Folder:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          type: string
        parent_folder_id:
          format: uuid
          type:
            - string
            - "null"
        sort_order:
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - parent_folder_id
        - name
        - sort_order
        - version
        - created_at
        - updated_at
      type: object
    ImageSummary:
      additionalProperties: false
      properties:
        thumbnail_url:
          description: Present for uploads only.
          type: string
        url:
          type: string
      required:
        - url
      type: object
    Item:
      additionalProperties: false
      properties:
        content_version:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        image:
          description: An item image, either an external URL or an uploaded attachment. null when the item has no image.
          oneOf:
            - $ref: "#/components/schemas/UploadImage"
            - $ref: "#/components/schemas/UrlImage"
            - type: "null"
        list_id:
          format: uuid
          type: string
        metadata:
          additionalProperties: {}
          description: Validated against the list's type; its shape depends on the type.
          type: object
        path:
          description: Ancestor folders and the list. Present on getItem only.
          items:
            $ref: "#/components/schemas/PathSegment"
          type: array
        price:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
        sort_order:
          format: int64
          type: integer
        title:
          type: string
        type:
          description: null when the list has no type.
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
        website:
          type:
            - string
            - "null"
      required:
        - content_version
        - created_at
        - id
        - image
        - list_id
        - metadata
        - price
        - sort_order
        - title
        - type
        - updated_at
        - version
        - website
      type: object
    ItemPage:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/ItemSummary"
          type: array
        page:
          $ref: "#/components/schemas/Page"
      required:
        - data
        - page
      type: object
    ItemSummary:
      additionalProperties: false
      properties:
        content_version:
          format: int64
          type: integer
        created_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        image:
          oneOf:
            - $ref: "#/components/schemas/ImageSummary"
            - type: "null"
        list_id:
          format: uuid
          type: string
        metadata:
          additionalProperties: {}
          type: object
        price:
          oneOf:
            - $ref: "#/components/schemas/Price"
            - type: "null"
        sort_order:
          format: int64
          type: integer
        title:
          type: string
        type:
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
        website:
          type:
            - string
            - "null"
      required:
        - content_version
        - created_at
        - id
        - image
        - list_id
        - metadata
        - price
        - sort_order
        - title
        - type
        - updated_at
        - version
        - website
      type: object
    List:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type:
            - string
            - "null"
        display_mode:
          enum:
            - compact
            - thumbnail
            - grid
          type: string
        folder_id:
          format: uuid
          type:
            - string
            - "null"
        icon:
          type:
            - string
            - "null"
        icon_color:
          enum:
            - red
            - orange
            - amber
            - green
            - teal
            - blue
            - indigo
            - purple
            - pink
            - gray
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        item_count:
          format: int64
          type: integer
        name:
          type: string
        pinned_fields:
          items:
            type: string
          type:
            - array
            - "null"
        sort_mode:
          type: string
        sort_order:
          format: int64
          type: integer
        type:
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - id
        - folder_id
        - name
        - type
        - description
        - display_mode
        - sort_mode
        - pinned_fields
        - icon
        - icon_color
        - sort_order
        - item_count
        - version
        - created_at
        - updated_at
      type: object
    ListWithPath:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          type:
            - string
            - "null"
        display_mode:
          enum:
            - compact
            - thumbnail
            - grid
          type: string
        folder_id:
          format: uuid
          type:
            - string
            - "null"
        icon:
          type:
            - string
            - "null"
        icon_color:
          enum:
            - red
            - orange
            - amber
            - green
            - teal
            - blue
            - indigo
            - purple
            - pink
            - gray
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        item_count:
          format: int64
          type: integer
        name:
          type: string
        path:
          items:
            $ref: "#/components/schemas/PathSegment"
          type: array
        pinned_fields:
          items:
            type: string
          type:
            - array
            - "null"
        sort_mode:
          type: string
        sort_order:
          format: int64
          type: integer
        type:
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
        version:
          format: int64
          type: integer
      required:
        - path
        - id
        - folder_id
        - name
        - type
        - description
        - display_mode
        - sort_mode
        - pinned_fields
        - icon
        - icon_color
        - sort_order
        - item_count
        - version
        - created_at
        - updated_at
      type: object
    LookupItemRequest:
      additionalProperties: false
      properties:
        mode:
          description: fill (default), rematch or refresh.
          type: string
        source_id:
          description: Selects a known Open Library work (book items). Without it, fill and rematch search by title and refresh uses the stored metadata.openlibrary_id.
          type: string
        tmdb_id:
          description: Selects a known TMDB match (movie and TV items). Without it, fill and rematch search by title and refresh uses the stored metadata.tmdb_id.
          format: int64
          type: integer
      type: object
    MoveFolderRequest:
      additionalProperties: false
      properties:
        parent_folder_id:
          format: uuid
          type:
            - string
            - "null"
      required:
        - parent_folder_id
      type: object
    MoveItemRequest:
      additionalProperties: false
      properties:
        list_id:
          format: uuid
          type: string
      type: object
    MoveListRequest:
      additionalProperties: false
      properties:
        folder_id:
          format: uuid
          type:
            - string
            - "null"
      required:
        - folder_id
      type: object
    Page:
      additionalProperties: false
      properties:
        limit:
          format: int64
          type: integer
        offset:
          format: int64
          type: integer
        total:
          description: Total rows matching, ignoring limit and offset.
          format: int64
          type: integer
      required:
        - limit
        - offset
        - total
      type: object
    PathSegment:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        type:
          enum:
            - folder
            - list
          type: string
      required:
        - id
        - name
        - type
      type: object
    Price:
      additionalProperties: false
      properties:
        currency:
          type: string
        max:
          type:
            - string
            - "null"
        min:
          type:
            - string
            - "null"
      required:
        - currency
        - max
        - min
      type: object
    PriceInput:
      additionalProperties: false
      properties:
        amount:
          type: string
        currency:
          type: string
        max:
          type: string
        min:
          type: string
      type: object
    Problem:
      additionalProperties: false
      description: |
        An RFC 9457 problem, the body of every error response. `code` is stable and is one of:

        - `malformed_request`: The request cannot be read: a body that is not JSON, a missing or unsupported Content-Type, or a value of the wrong JSON type (400).
        - `invalid_parameter`: A path, query or header value does not parse or is out of range (400). `detail` names the parameter.
        - `unknown_field`: A body key the schema does not declare (400). `detail` gives its path.
        - `precondition_required`: A versioned resource is changed without a usable `If-Match` (428).
        - `payload_too_large`: The body is over the limit of the operation (413).
        - `unsupported_media_type`: An upload is not JPEG, PNG or WebP (415).
        - `not_found`: The resource is missing or trashed, or the endpoint does not exist (404).
        - `method_not_allowed`: The path exists but does not accept this method (405).
        - `version_conflict`: The `If-Match` version is stale (412). `current_version` is the stored one.
        - `validation_failed`: One or more fields break a rule (422). `errors` lists them.
        - `cycle_detected`: A folder would be moved into itself or one of its descendants (409).
        - `parent_in_trash`: A restore without a destination whose parent is trashed (409). `blocking_parent` names it.
        - `destination_unavailable`: A move, restore or create targets a folder or list that is missing or trashed (409).
        - `type_mismatch`: An item would move to a list of another type (409).
        - `type_key_taken`: A type would take a key that another type of the workspace already has (409).
        - `order_stale`: A reorder names an id set that no longer matches the stored one (409).
        - `lookup_disabled`: A lookup was requested but its integration is not configured on this server (503).
        - `upstream_unavailable`: A lookup provider could not be reached or answered in time (503).
        - `client_closed_request`: The client closed the request before the answer was ready (499). Logged at DEBUG only.
        - `internal`: An unexpected error (500). `request_id` is the only detail; the cause is in the server log.
        - `conflict`: Generic 409 for a status Huma reports without detail.
        - `precondition_failed`: Generic 412 for a status Huma reports without detail.
        - `unprocessable_entity`: Generic 422 for a status Huma reports without detail.
        - `service_unavailable`: Generic 503 for a status Huma reports without detail.
      properties:
        blocking_parent:
          $ref: "#/components/schemas/BlockingParent"
        code:
          description: Stable machine-readable code
          type: string
        current_version:
          format: int64
          type: integer
        detail:
          type: string
        errors:
          items:
            $ref: "#/components/schemas/FieldError"
          type:
            - array
            - "null"
        request_id:
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          description: Problem type URI
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    RecentItems:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: "#/components/schemas/SearchResult"
          type: array
      required:
