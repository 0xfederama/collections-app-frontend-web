    get:
      description: "Sorted by `sort` (default: the list's `sort_mode`), tie-break `id`. `q` filters by title and, on movie lists, director. `price` sorts by `price.min` and is available only when the type allows price. Field filters combine with `q`."
      operationId: listItems
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
        - description: Defaults to the list's sort_mode; may be a field key of the list type.
          explode: false
          in: query
          name: sort
          schema:
            description: Defaults to the list's sort_mode; may be a field key of the list type.
            maxLength: 32
            minLength: 1
            type: string
        - description: Case-insensitive title filter; on movie lists it also matches metadata.director.
          explode: false
          in: query
          name: q
          schema:
            description: Case-insensitive title filter; on movie lists it also matches metadata.director.
            maxLength: 200
            minLength: 1
            type: string
        - description: Type field key to filter. Requires value or range parameters matching the field type.
          explode: false
          in: query
          name: filter_field
          schema:
            description: Type field key to filter. Requires value or range parameters matching the field type.
            maxLength: 32
            minLength: 1
            type: string
        - description: Text/link substring or boolean (true/false) filter value.
          explode: false
          in: query
          name: filter_value
          schema:
            description: Text/link substring or boolean (true/false) filter value.
            maxLength: 200
            type: string
        - description: Inclusive lower bound for number or ISO date field filters.
          explode: false
          in: query
          name: filter_min
          schema:
            description: Inclusive lower bound for number or ISO date field filters.
            maxLength: 64
