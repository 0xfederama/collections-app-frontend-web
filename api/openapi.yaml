      additionalProperties: false
      properties:
        ids:
          items:
            format: uuid
            type: string
          type: array
        parent_folder_id:
          format: uuid
          type:
            - string
            - "null"
      required:
        - parent_folder_id
        - ids
      type: object
    ReorderItemsRequest:
      additionalProperties: false
      properties:
        ids:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
      type: object
    ReorderListsRequest:
      additionalProperties: false
      properties:
        folder_id:
          format: uuid
          type:
            - string
            - "null"
        ids:
          items:
            format: uuid
            type: string
          type: array
      required:
        - folder_id
        - ids
      type: object
    ReorderTypeFieldsRequest:
      additionalProperties: false
      properties:
        keys:
          items:
            type: string
