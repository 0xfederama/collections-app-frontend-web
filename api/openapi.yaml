            - amazon
            - bookshop
            - apple_books
            - google_play_books
            - kobo
          type: string
        streaming_country_code:
          pattern: ^[A-Z]{2}$
          type: string
        trash_retention_days:
          format: int64
          maximum: 365
          minimum: 1
          type:
            - integer
            - "null"
        version:
          format: int64
          type: integer
        workspace_name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - workspace_name
        - streaming_country_code
        - metadata_language
        - lookup_available
        - book_lookup_available
        - markdown_history_limit
        - trash_retention_days
        - preferred_store
        - version
