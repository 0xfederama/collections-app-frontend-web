        original_title:
          type: string
        overview:
          type: string
        poster_url:
          description: For suggestion display only, not an item image.
          format: uri
          type:
            - string
            - "null"
        title:
          type: string
        tmdb_id:
          format: int64
          minimum: 1
          type: integer
        year:
          format: int64
          type:
            - integer
            - "null"
      required:
        - overview
        - original_title
        - poster_url
        - tmdb_id
        - title
        - year
      type: object
    TmdbSuggestions:
      additionalProperties: false
      properties:
        available:
          type: boolean
        results:
          items:
            $ref: "#/components/schemas/TmdbSuggestion"
