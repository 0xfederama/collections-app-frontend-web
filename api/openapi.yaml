          description: Not Found
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Precondition Failed
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Request Entity Too Large
        "422":
          content:
