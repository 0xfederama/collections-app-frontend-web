      required:
        - data
        - page
      type: object
    SearchPathSegment:
      additionalProperties: false
      properties:
        icon:
          type:
            - string
            - "null"
        icon_color:
          enum:
            - red
            - orange
            - amber
            - green
            - teal
            - blue
            - indigo
            - purple
            - pink
            - gray
          type:
            - string
            - "null"
        id:
          format: uuid
          type: string
        name:
          type: string
        type:
          enum:
            - folder
            - list
          type: string
      required:
