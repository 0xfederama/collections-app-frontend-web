            deleted_at: '2026-10-13T18:20:00Z'
            counts: { folders: 0, lists: 0, items: 1 }
            restorable_in_place: false
        page: { limit: 50, offset: 0, total: 2 }
  schemas:
    # ---- Errors ----
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, description: 'URI identifying the problem, e.g. https://collection-app.invalid/problems/version-conflict.' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable machine-readable code.
          enum:
            - malformed_request
            - unknown_field
            - invalid_parameter
            - not_found
            - cycle_detected
            - parent_in_trash
            - destination_unavailable
            - kind_mismatch
            - order_stale
            - version_conflict
            - payload_too_large
            - unsupported_media_type
            - validation_failed
            - lookup_disabled
            - upstream_unavailable
            - precondition_required
            - internal
        request_id: { type: string, description: Only on `internal` problems. Matches the `X-Request-Id` header. }
    VersionConflictProblem:
      description: '`412 version_conflict`.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [current_version]
          properties:
            current_version: { type: integer, description: The resource's current `version`. }
    ValidationProblem:
      description: '`422 validation_failed`.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, description: 'Dotted path, e.g. `price.max`.' }
                  message: { type: string }
    RestoreConflictProblem:
      description: '`409` from a trash restore. `blocking_parent` is present for `parent_in_trash`.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            blocking_parent: { $ref: '#/components/schemas/PathSegment' }
    # ---- Shared ----
    Page:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, description: "Total rows matching, ignoring limit and offset." }
    PathSegment:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, enum: [folder, list] }
        id: { type: string, format: uuid }
        name: { type: string }
    SearchPathSegment:
      type: object
      description: |
        An ancestor of a search result (F012-B1). `icon` and `icon_color` are the list's own (list segments); both are `null` on folder segments.
      required: [type, id, name, icon, icon_color]
      properties:
        type: { type: string, enum: [folder, list] }
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { $ref: '#/components/schemas/ListIcon' }
        icon_color: { $ref: '#/components/schemas/ListIconColor' }
    Price:
      type: object
      nullable: true
      description: |
        A price in responses: always `min`, `max` and `currency`. A single price has `min` equal to `max`. Money is a decimal string
        (D-062). An open range (only one bound) can exist for prices created before 0.3.0.
      additionalProperties: false
      required: [min, max, currency]
      properties:
        min: { type: string, nullable: true, pattern: '^\d{1,10}\.\d{2}$', example: '12.00' }
        max: { type: string, nullable: true, pattern: '^\d{1,10}\.\d{2}$', example: '15.00' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: EUR }
    PriceInput:
      type: object
      nullable: true
      description: |
        A price in requests, either a single price `{amount, currency}` or a range `{min, max, currency}`. `amount` and `min`/`max`
        are mutually exclusive (`422 validation_failed` when mixed); `min` must not exceed `max`; a range needs at least one bound.
        `null` clears the price. Money is a decimal string (D-062).
      additionalProperties: false
      required: [currency]
      properties:
        amount: { type: string, pattern: '^\d{1,10}\.\d{2}$', example: '12.00', description: Single price. Stored as `min` = `max`. }
        min: { type: string, nullable: true, pattern: '^\d{1,10}\.\d{2}$', example: '12.00' }
        max: { type: string, nullable: true, pattern: '^\d{1,10}\.\d{2}$', example: '15.00' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: EUR }
    UrlImage:
      type: object
      required: [source, url]
      properties:
        source: { type: string, enum: [url] }
        url: { type: string, maxLength: 2048 }
    UploadImage:
      type: object
      required: [source, attachment_id, url, thumbnail_url, width, height, original_filename]
      properties:
        source: { type: string, enum: [upload] }
        attachment_id: { type: string, format: uuid }
        url: { type: string, description: 'Always `/api/v1/attachments/{id}/file`.' }
        thumbnail_url: { type: string, description: 'Always `/api/v1/attachments/{id}/thumbnail`.' }
        width: { type: integer }
        height: { type: integer }
        original_filename: { type: string, nullable: true, maxLength: 255 }
    Image:
      description: An item image, either an external URL or an uploaded attachment. `null` when the item has no image.
      type: object
      nullable: true
      oneOf:
        - $ref: '#/components/schemas/UrlImage'
        - $ref: '#/components/schemas/UploadImage'
      discriminator:
        propertyName: source
        mapping:
          url: '#/components/schemas/UrlImage'
          upload: '#/components/schemas/UploadImage'
    ImageSummary:
      type: object
      nullable: true
      description: The image reduced for list rows and search. `thumbnail_url` is present for uploads only.
      required: [url]
      properties:
        url: { type: string }
        thumbnail_url: { type: string }
    BinaryFile:
      type: string
      format: binary
    # ---- Settings, tree ----
    KindField:
      type: object
      required: [key, label, type, position, is_locked, version]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, number, date, boolean, link, streaming] }
        position: { type: integer, minimum: 0 }
        is_locked: { type: boolean }
        version: { type: integer }
    KindDefinition:
      type: object
      required: [key, name, allows_price, is_locked, version, fields]
      properties:
        key: { type: string }
        name: { type: string }
        default_icon: { type: string, nullable: true }
        allows_price: { type: boolean }
        default_sort_field: { type: string, nullable: true, maxLength: 32 }
        default_pinned_fields: { type: array, nullable: true, items: { type: string, maxLength: 32 }, maxItems: 2 }
        is_locked: { type: boolean }
        version: { type: integer }
        fields: { type: array, items: { $ref: '#/components/schemas/KindField' } }
    CreateKindRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        default_icon: { type: string, nullable: true }
        allows_price: { type: boolean }
        default_sort_field: { type: string, nullable: true, maxLength: 32 }
        default_pinned_fields: { type: array, nullable: true, items: { type: string, maxLength: 32 }, maxItems: 2 }
    UpdateKindRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        default_icon: { type: string, nullable: true }
        allows_price: { type: boolean }
        default_sort_field: { type: string, nullable: true, maxLength: 32 }
        default_pinned_fields: { type: array, nullable: true, items: { type: string, maxLength: 32 }, maxItems: 2 }
    CreateKindFieldRequest:
      type: object
      required: [label, type]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 100 }
        type: { type: string, enum: [text, number, date, boolean, link] }
    UpdateKindFieldRequest:
      type: object
      required: [label]
      additionalProperties: false
      properties: { label: { type: string, minLength: 1, maxLength: 100 } }
    ReorderKindFieldsRequest:
      type: object
      required: [keys]
      additionalProperties: false
      properties: { keys: { type: array, items: { type: string }, uniqueItems: true } }
    KindFieldDeletePreview:
      type: object
      required: [populated_item_count]
      properties:
        populated_item_count: { type: integer, minimum: 0, description: "Number of items, including trashed items, with a value for this field." }
    Settings:
      type: object
      required: [workspace_name, streaming_country_code, metadata_language, lookup_available, markdown_history_limit, trash_retention_days, version]
      properties:
        workspace_name: { type: string, minLength: 1, maxLength: 200 }
        streaming_country_code: { type: string, pattern: '^[A-Z]{2}$' }
        metadata_language: { $ref: '#/components/schemas/MetadataLanguage' }
        lookup_available: { type: boolean, readOnly: true, description: Whether this server has TMDB lookup configured. }
        markdown_history_limit: { type: integer, minimum: 0, maximum: 200 }
        trash_retention_days: { type: integer, nullable: true, minimum: 1, maximum: 365 }
        version: { type: integer }
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        workspace_name: { type: string, minLength: 1, maxLength: 200 }
        streaming_country_code: { type: string, pattern: '^[A-Z]{2}$' }
        metadata_language: { $ref: '#/components/schemas/MetadataLanguage' }
        markdown_history_limit: { type: integer, minimum: 0, maximum: 200 }
        trash_retention_days: { type: integer, nullable: true, minimum: 1, maximum: 365 }
    MetadataLanguage:
      type: string
      pattern: '^[a-z]{2}(-[A-Z]{2})?$'
      example: it-IT
      description: ISO 639-1 language (`xx`), optionally with an uppercase region (`xx-YY`), passed to TMDB.
    Tree:
      type: object
      required: [folders, lists]
      properties:
        folders:
          type: array
          items: { $ref: '#/components/schemas/Folder' }
        lists:
          type: array
          items: { $ref: '#/components/schemas/List' }
    # ---- Folders ----
    Folder:
      type: object
      required: [id, parent_folder_id, name, sort_order, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        parent_folder_id: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        sort_order: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        parent_folder_id: { type: string, format: uuid, nullable: true }
    UpdateFolderRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    MoveFolderRequest:
      type: object
      additionalProperties: false
      required: [parent_folder_id]
      properties:
        parent_folder_id: { type: string, format: uuid, nullable: true, description: '`null` = root.' }
    ReorderFoldersRequest:
      type: object
      additionalProperties: false
      required: [parent_folder_id, ids]
      properties:
        parent_folder_id: { type: string, format: uuid, nullable: true, description: '`null` = root.' }
        ids:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
    # ---- Lists ----
    DisplayMode:
      type: string
      enum: [compact, thumbnail, grid]
    SortMode:
      type: string
      description: |
        One of `manual`, `title`, `updated`, `price`, or a field key from the list kind. The manual order is kept when the mode changes.
    PinnedFields:
      type: array
      nullable: true
      maxItems: 2
      items: { type: string, maxLength: 32 }
      description: |
        The fields a list shows in its rows, in order: the first is the primary field, the second the secondary (F009-B2; replaces the
        `{under, right}` slots of F-002). `null` means the kind default. `[]` pins nothing, which is different from `null`, and a single-element list is valid.
        Any field defined for the kind can be pinned; `price` is also available when the kind allows it. At most 2 unique keys
        (`422 validation_failed` on `pinned_fields[i]`), else `422`. Changing the list's `kind` resets it to `null`.
      example: [release_year, runtime_minutes]
    ListIcon:
      type: string
      nullable: true
      maxLength: 64
      example: i:film
      description: |
        The icon of a list (F012-B1): an emoji (one grapheme) or `i:<name>` for a built-in icon key. `null` is the default icon.
        Lists only. The service checks the value: `422 validation_failed` on `icon` for anything else.
    ListIconColor:
      type: string
      nullable: true
      enum: [red, orange, amber, green, teal, blue, indigo, purple, pink, gray, null]
      example: indigo
      description: |
        The colour of a built-in icon, one of ten palette names (F012-B1). `null` is the normal text colour. Allowed only when `icon`
        is a built-in icon: `422 validation_failed` on `icon_color` otherwise. It is cleared when the icon changes to an emoji or to `null`.
    List:
      type: object
      required: [id, folder_id, name, kind, description, display_mode, sort_mode, pinned_fields, icon, icon_color, sort_order, item_count, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        folder_id: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: '#/components/schemas/ItemKind' }
        description: { type: string, nullable: true, maxLength: 65536, description: 'Markdown, up to 64 KiB (UTF-8 bytes).' }
        display_mode: { $ref: '#/components/schemas/DisplayMode' }
        sort_mode: { $ref: '#/components/schemas/SortMode' }
        pinned_fields: { $ref: '#/components/schemas/PinnedFields' }
        icon: { $ref: '#/components/schemas/ListIcon' }
        icon_color: { $ref: '#/components/schemas/ListIconColor' }
        sort_order: { type: integer }
        item_count: { type: integer, description: Number of active items. }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        path:
          type: array
          description: Ancestor folders. Present on `getList` only.
          items: { $ref: '#/components/schemas/PathSegment' }
    CreateListRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: '#/components/schemas/ItemKind' }
        folder_id: { type: string, format: uuid, nullable: true }
        description: { type: string, nullable: true, maxLength: 65536, description: 'Markdown, up to 64 KiB (UTF-8 bytes).' }
        display_mode: { $ref: '#/components/schemas/DisplayMode' }
        sort_mode: { $ref: '#/components/schemas/SortMode' }
        pinned_fields: { $ref: '#/components/schemas/PinnedFields' }
        icon: { $ref: '#/components/schemas/ListIcon' }
        icon_color: { $ref: '#/components/schemas/ListIconColor' }
    UpdateListRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        kind: { $ref: '#/components/schemas/ItemKind' }
        description: { type: string, nullable: true, maxLength: 65536, description: 'Markdown, up to 64 KiB (UTF-8 bytes).' }
        display_mode: { $ref: '#/components/schemas/DisplayMode' }
        sort_mode: { $ref: '#/components/schemas/SortMode' }
        pinned_fields: { $ref: '#/components/schemas/PinnedFields' }
        icon: { $ref: '#/components/schemas/ListIcon' }
        icon_color: { $ref: '#/components/schemas/ListIconColor' }
    MoveListRequest:
      type: object
      additionalProperties: false
      required: [folder_id]
      properties:
        folder_id: { type: string, format: uuid, nullable: true, description: '`null` = root.' }
    ReorderListsRequest:
      type: object
      additionalProperties: false
      required: [folder_id, ids]
      properties:
        folder_id: { type: string, format: uuid, nullable: true, description: '`null` = root.' }
        ids:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
    # ---- Items ----
    ItemKind:
      type: string
      description: |
        The kind of a list. Items have no kind of their own: theirs is read-only and derived from their list. Changing the kind of a
        list that has items clears the `metadata` of all its items.
    ItemBase:
      type: object
      description: Fields shared by every item kind. `kind` (read-only, derived from the list) and `metadata` are added by the per-kind schemas.
      required: [id, list_id, title, image, price, website, content_version, sort_order, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        image: { $ref: '#/components/schemas/Image' }
        price: { $ref: '#/components/schemas/Price' }
        website: { type: string, nullable: true, maxLength: 2048 }
        content_version: { type: integer, description: 'Current Markdown version (0 = empty). For display only; use the content endpoints to edit.' }
        sort_order: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        path:
          type: array
          description: Ancestor folders and the list. Present on `getItem` only.
          items: { $ref: '#/components/schemas/PathSegment' }
    GenericItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [generic], readOnly: true }
            metadata: { $ref: '#/components/schemas/GenericMetadata' }
    MovieItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [movie], readOnly: true }
            metadata: { $ref: '#/components/schemas/MovieMetadata' }
    TvShowItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [tv_show], readOnly: true }
            metadata: { $ref: '#/components/schemas/TvShowMetadata' }
    MotorcycleItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [motorcycle], readOnly: true }
            metadata: { $ref: '#/components/schemas/MotorcycleMetadata' }
    CarItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [car], readOnly: true }
            metadata: { $ref: '#/components/schemas/CarMetadata' }
    CameraItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [camera], readOnly: true }
            metadata: { $ref: '#/components/schemas/CameraMetadata' }
    Item:
      description: An item. `kind` is read-only and derived from the item's list; `metadata` is validated against that workspace kind's field definitions.
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, readOnly: true }
            metadata:
              type: object
              additionalProperties: true
    ItemSummary:
      type: object
      description: "An item row in lists, search and recent items: the same `metadata` object as the full item (`{}` when the kind has none), and the image is reduced."
      required: [id, list_id, title, kind, image, price, website, metadata, content_version, sort_order, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        title: { type: string }
        kind: { $ref: '#/components/schemas/ItemKind' }
        image: { $ref: '#/components/schemas/ImageSummary' }
        price: { $ref: '#/components/schemas/Price' }
        website: { type: string, nullable: true }
        metadata:
          type: object
          description: 'Same object as `metadata` on the full item; its shape depends on `kind` (see the `*Metadata` schemas).'
          additionalProperties: true
        content_version: { type: integer }
        sort_order: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ItemPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ItemSummary' }
        page: { $ref: '#/components/schemas/Page' }
    SearchResult:
      type: object
      required: [item, path, kind_name]
      properties:
        item: { $ref: '#/components/schemas/ItemSummary' }
        kind_name: { type: string, description: The display name from this workspace's kind definition. }
        path:
          type: array
          items: { $ref: '#/components/schemas/SearchPathSegment' }
    SearchPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        page: { $ref: '#/components/schemas/Page' }
    RecentItems:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        lookup:
          type: boolean
          default: true
          description: For movie and TV lists, run TMDB lookup during creation. Ignored on other kinds.
        tmdb_id:
          type: integer
          minimum: 1
          description: Optional selected TMDB suggestion. Used only when lookup runs on a movie or TV item.
        price: { $ref: '#/components/schemas/PriceInput' }
        website: { type: string, nullable: true, maxLength: 2048 }
        metadata:
          type: object
          description: 'Free-form here because its shape depends on the list''s kind. Validated against that kind: see the `*Metadata` schemas.'
          additionalProperties: true
    UpdateItemRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        price: { $ref: '#/components/schemas/PriceInput' }
        website: { type: string, nullable: true, maxLength: 2048 }
        metadata:
          type: object
          description: 'Free-form here because its shape depends on the list''s kind. Validated against that kind: see the `*Metadata` schemas.'
          additionalProperties: true
    MoveItemRequest:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: { type: string, format: uuid }
    ReorderItemsRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
    LookupItemRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [fill, rematch, refresh]
          default: fill
        tmdb_id:
          type: integer
          minimum: 1
          description: Selects a known TMDB match. Without it, fill/rematch searches by title and refresh uses stored metadata.tmdb_id.
    TmdbKind:
      type: string
      enum: [movie, tv_show]
    TmdbSuggestion:
      type: object
      required: [tmdb_id, title, original_title, year, poster_url, overview]
      properties:
        tmdb_id: { type: integer, minimum: 1 }
        title: { type: string }
        original_title: { type: string }
        year: { type: integer, nullable: true }
        poster_url: { type: string, format: uri, nullable: true }
        overview: { type: string }
    TmdbSuggestions:
      type: object
      required: [available, results]
      properties:
        available: { type: boolean }
        results:
          type: array
          items: { $ref: '#/components/schemas/TmdbSuggestion' }
    # ---- Kind metadata (F-007: trimmed to the kept fields; sort key marked). All keys optional; text is trimmed, max 100 chars unless noted. ----
    Streaming:
      type: object
      additionalProperties: false
      required: [country]
      properties:
        country: { type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2. }
        platforms:
          type: array
          maxItems: 30
          description: Unique case-insensitively.
          items: { type: string, maxLength: 60 }
        paid_platforms:
          type: array
          maxItems: 30
          description: Platforms available only through per-title rental or purchase, not subscription, free, or ad-supported offers. Each entry must match (case-insensitively) an entry of `platforms` and is stored with that entry's casing. Unique case-insensitively. Omitted, null or empty means none paid.
          items: { type: string, maxLength: 60 }
    GenericMetadata:
      type: object
      description: Must be `{}`.
      additionalProperties: false
      maxProperties: 0
    MovieMetadata:
      type: object
      additionalProperties: false
      properties:
        release_year: { type: integer, minimum: 1870, maximum: 2100 }
        runtime_minutes: { type: integer, minimum: 1, maximum: 1000 }
        director: { type: string, minLength: 1, maxLength: 300, description: Movie directors joined with a comma when TMDB returns several. }
        imdb_url: { type: string, pattern: '^https://(www\.|m\.)?imdb\.com/title/tt\d{7,10}/?$' }
        streaming: { $ref: '#/components/schemas/Streaming' }
        tmdb_id: { type: integer, minimum: 1, description: Stored provider identity used by refresh. }
        lookup_disabled: { type: boolean, description: Per-item opt-out from automatic TMDB lookup. }
    TvShowMetadata:
      type: object
      additionalProperties: false
      properties:
        first_air_year: { type: integer, minimum: 1920, maximum: 2100 }
        end_year: { type: integer, minimum: 1920, maximum: 2100, description: 'At least `first_air_year`. Absent = ongoing.' }
        seasons: { type: integer, minimum: 1, maximum: 200 }
        episodes_per_season: { type: integer, minimum: 1, maximum: 500 }
        episode_minutes: { type: integer, minimum: 1, maximum: 1000, description: Average episode duration in minutes. }
        imdb_url: { type: string, pattern: '^https://(www\.|m\.)?imdb\.com/title/tt\d{7,10}/?$' }
        streaming: { $ref: '#/components/schemas/Streaming' }
        tmdb_id: { type: integer, minimum: 1, description: Stored provider identity used by refresh. }
        lookup_disabled: { type: boolean, description: Per-item opt-out from automatic TMDB lookup. }
    MotorcycleMetadata:
      type: object
      additionalProperties: false
      properties:
        model_year: { type: integer, minimum: 1885, maximum: 2100 }
        displacement_cc: { type: integer, minimum: 1, maximum: 5000 }
        power_hp: { type: number, minimum: 0, maximum: 1000, description: One decimal. }
        license_class: { type: string, enum: [AM, A1, A2, A] }
    CarMetadata:
      type: object
      additionalProperties: false
      properties:
        make: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        model_year: { type: integer, minimum: 1885, maximum: 2100 }
        fuel_type: { type: string, enum: [petrol, diesel, hybrid, plugin_hybrid, electric, lpg, cng, hydrogen, other] }
        power_hp: { type: number, minimum: 0, maximum: 2000, description: One decimal. }
    CameraMetadata:
      type: object
      additionalProperties: false
      properties:
        camera_type: { type: string, enum: [mirrorless, dslr, film] }
        release_year: { type: integer, minimum: 1900, maximum: 2100 }
        sensor_format: { type: string, enum: [full_frame, aps_c, micro_four_thirds, one_inch, medium_format, film_35mm, other] }
        megapixels: { type: number, minimum: 0.1, maximum: 500, description: One decimal. }
    # ---- Image requests ----
    UploadImageRequest:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: "JPEG, PNG or WebP, up to 10 MiB." }
    SetImageUrlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: An https URL. }
    # ---- Content ----
    Content:
      type: object
      required: [item_id, version, body, updated_at]
      properties:
        item_id: { type: string, format: uuid }
        version: { type: integer, minimum: 0, description: 0 = never saved. }
        body: { type: string, description: "Markdown source, up to 1 MiB UTF-8." }
        updated_at: { type: string, format: date-time, nullable: true, description: When this version was saved. `null` for version 0. }
    UpdateContentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, maxLength: 1048576, description: Up to 1 MiB UTF-8 (the server checks bytes). }
    RestoreContentRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    ContentVersionInfo:
      type: object
      required: [version, size_bytes, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        size_bytes: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    ContentVersionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ContentVersionInfo' }
    # ---- Trash ----
    TrashEntry:
      type: object
      required: [id, root_type, root_id, root_name, former_path, deleted_at, counts, restorable_in_place]
      properties:
        id: { type: string, format: uuid, description: The trash batch ID. }
        root_type: { type: string, enum: [folder, list, item] }
        root_id: { type: string, format: uuid }
        root_name: { type: string }
        former_path:
          type: array
          items: { $ref: '#/components/schemas/PathSegment' }
        deleted_at: { type: string, format: date-time }
        counts:
          type: object
          required: [folders, lists, items]
          properties:
            folders: { type: integer }
            lists: { type: integer }
            items: { type: integer }
        restorable_in_place: { type: boolean, description: False when the original parent is trashed or gone. }
    TrashPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TrashEntry' }
        page: { $ref: '#/components/schemas/Page' }
    RestoreTrashRequest:
      type: object
      additionalProperties: false
      properties:
        destination:
          type: object
          additionalProperties: false
          description: '`folder_id` for a folder or list root (`null` = workspace root), `list_id` for an item root.'
          properties:
            folder_id: { type: string, format: uuid, nullable: true }
            list_id: { type: string, format: uuid }
    RestoreResult:
      type: object
      required: [root_type, root_id]
      properties:
        root_type: { type: string, enum: [folder, list, item] }
        root_id: { type: string, format: uuid }
