  schemas:
    # ---- Errors ----
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, description: 'URI identifying the problem, e.g. https://collection-app.invalid/problems/version-conflict.' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable machine-readable code.
          enum:
            - malformed_request
            - unknown_field
            - invalid_parameter
            - not_found
            - cycle_detected
            - parent_in_trash
            - destination_unavailable
            - order_stale
            - version_conflict
            - payload_too_large
            - unsupported_media_type
            - validation_failed
            - precondition_required
            - internal
        request_id: { type: string, description: Only on `internal` problems. Matches the `X-Request-Id` header. }
    VersionConflictProblem:
      description: '`412 version_conflict`.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [current_version]
          properties:
            current_version: { type: integer, description: The resource's current `version`. }
    ValidationProblem:
      description: '`422 validation_failed`.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string, description: 'Dotted path, e.g. `price.max`.' }
                  message: { type: string }
    RestoreConflictProblem:
      description: '`409` from a trash restore. `blocking_parent` is present for `parent_in_trash`.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            blocking_parent: { $ref: '#/components/schemas/PathSegment' }
    # ---- Shared ----
    Page:
      type: object
      required: [limit, offset, total]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer, description: "Total rows matching, ignoring limit and offset." }
    PathSegment:
      type: object
      required: [type, id, name]
      properties:
        type: { type: string, enum: [folder, list] }
        id: { type: string, format: uuid }
        name: { type: string }
    Price:
      type: object
      nullable: true
      description: At least one of `min` and `max` is set when a price exists. `min` must not exceed `max`.
      additionalProperties: false
      required: [min, max, currency]
      properties:
        min: { type: string, nullable: true, pattern: '^\d{1,10}\.\d{2}$', example: '12.00' }
        max: { type: string, nullable: true, pattern: '^\d{1,10}\.\d{2}$', example: '15.00' }
        currency: { type: string, pattern: '^[A-Z]{3}$', example: EUR }
    UrlImage:
      type: object
      required: [source, url]
      properties:
        source: { type: string, enum: [url] }
        url: { type: string, maxLength: 2048 }
    UploadImage:
      type: object
      required: [source, attachment_id, url, thumbnail_url, width, height, original_filename]
      properties:
        source: { type: string, enum: [upload] }
        attachment_id: { type: string, format: uuid }
        url: { type: string, description: 'Always `/api/v1/attachments/{id}/file`.' }
        thumbnail_url: { type: string, description: 'Always `/api/v1/attachments/{id}/thumbnail`.' }
        width: { type: integer }
        height: { type: integer }
        original_filename: { type: string, nullable: true, maxLength: 255 }
    Image:
      description: An item image, either an external URL or an uploaded attachment. `null` when the item has no image.
      type: object
      nullable: true
      oneOf:
        - $ref: '#/components/schemas/UrlImage'
        - $ref: '#/components/schemas/UploadImage'
      discriminator:
        propertyName: source
        mapping:
          url: '#/components/schemas/UrlImage'
          upload: '#/components/schemas/UploadImage'
    ImageSummary:
      type: object
      nullable: true
      description: The image reduced for list rows and search. `thumbnail_url` is present for uploads only.
      required: [url]
      properties:
        url: { type: string }
        thumbnail_url: { type: string }
    BinaryFile:
      type: string
      format: binary
    # ---- Settings, tree ----
    Settings:
      type: object
      required: [workspace_name, streaming_country_code, default_currency, markdown_history_limit, version]
      properties:
        workspace_name: { type: string, minLength: 1, maxLength: 200 }
        streaming_country_code: { type: string, pattern: '^[A-Z]{2}$' }
        default_currency: { type: string, pattern: '^[A-Z]{3}$' }
        markdown_history_limit: { type: integer, minimum: 0, maximum: 200 }
        version: { type: integer }
    UpdateSettingsRequest:
      type: object
      additionalProperties: false
      properties:
        workspace_name: { type: string, minLength: 1, maxLength: 200 }
        streaming_country_code: { type: string, pattern: '^[A-Z]{2}$' }
        default_currency: { type: string, pattern: '^[A-Z]{3}$' }
        markdown_history_limit: { type: integer, minimum: 0, maximum: 200 }
    Tree:
      type: object
      required: [folders, lists]
      properties:
        folders:
          type: array
          items: { $ref: '#/components/schemas/Folder' }
        lists:
          type: array
          items: { $ref: '#/components/schemas/List' }
    # ---- Folders ----
    Folder:
      type: object
      required: [id, parent_folder_id, name, sort_order, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        parent_folder_id: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        sort_order: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateFolderRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        parent_folder_id: { type: string, format: uuid, nullable: true }
    UpdateFolderRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    MoveFolderRequest:
      type: object
      additionalProperties: false
      required: [parent_folder_id]
      properties:
        parent_folder_id: { type: string, format: uuid, nullable: true, description: '`null` = root.' }
    ReorderFoldersRequest:
      type: object
      additionalProperties: false
      required: [parent_folder_id, ids]
      properties:
        parent_folder_id: { type: string, format: uuid, nullable: true, description: '`null` = root.' }
        ids:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
    # ---- Lists ----
    DisplayMode:
      type: string
      enum: [compact, thumbnail, grid]
    SortMode:
      type: string
      enum: [manual, title, updated]
    List:
      type: object
      required: [id, folder_id, name, description, display_mode, sort_mode, sort_order, item_count, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        folder_id: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true, maxLength: 2000 }
        display_mode: { $ref: '#/components/schemas/DisplayMode' }
        sort_mode: { $ref: '#/components/schemas/SortMode' }
        sort_order: { type: integer }
        item_count: { type: integer, description: Number of active items. }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        path:
          type: array
          description: Ancestor folders. Present on `getList` only.
          items: { $ref: '#/components/schemas/PathSegment' }
    CreateListRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        folder_id: { type: string, format: uuid, nullable: true }
        description: { type: string, nullable: true, maxLength: 2000 }
        display_mode: { $ref: '#/components/schemas/DisplayMode' }
        sort_mode: { $ref: '#/components/schemas/SortMode' }
    UpdateListRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, nullable: true, maxLength: 2000 }
        display_mode: { $ref: '#/components/schemas/DisplayMode' }
        sort_mode: { $ref: '#/components/schemas/SortMode' }
    MoveListRequest:
      type: object
      additionalProperties: false
      required: [folder_id]
      properties:
        folder_id: { type: string, format: uuid, nullable: true, description: '`null` = root.' }
    ReorderListsRequest:
      type: object
      additionalProperties: false
      required: [folder_id, ids]
      properties:
        folder_id: { type: string, format: uuid, nullable: true, description: '`null` = root.' }
        ids:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
    # ---- Items ----
    ItemKind:
      type: string
      enum: [generic, movie, tv_show, motorcycle, car, camera]
    ItemBase:
      type: object
      description: Fields shared by every item kind. `kind` and `metadata` are added by the per-kind schemas.
      required: [id, list_id, title, summary, status, image, price, official_website_url, content_version, sort_order, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        summary: { type: string, nullable: true, maxLength: 1000 }
        status: { type: string, nullable: true, maxLength: 100 }
        image: { $ref: '#/components/schemas/Image' }
        price: { $ref: '#/components/schemas/Price' }
        official_website_url: { type: string, nullable: true, maxLength: 2048 }
        content_version: { type: integer, description: 'Current Markdown version (0 = empty). For display only; use the content endpoints to edit.' }
        sort_order: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        path:
          type: array
          description: Ancestor folders and the list. Present on `getItem` only.
          items: { $ref: '#/components/schemas/PathSegment' }
    GenericItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [generic] }
            metadata: { $ref: '#/components/schemas/GenericMetadata' }
    MovieItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [movie] }
            metadata: { $ref: '#/components/schemas/MovieMetadata' }
    TvShowItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [tv_show] }
            metadata: { $ref: '#/components/schemas/TvShowMetadata' }
    MotorcycleItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [motorcycle] }
            metadata: { $ref: '#/components/schemas/MotorcycleMetadata' }
    CarItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [car] }
            metadata: { $ref: '#/components/schemas/CarMetadata' }
    CameraItem:
      allOf:
        - $ref: '#/components/schemas/ItemBase'
        - type: object
          required: [kind, metadata]
          properties:
            kind: { type: string, enum: [camera] }
            metadata: { $ref: '#/components/schemas/CameraMetadata' }
    Item:
      description: An item. `metadata` has the shape of its `kind` (discriminated union).
      oneOf:
        - $ref: '#/components/schemas/GenericItem'
        - $ref: '#/components/schemas/MovieItem'
        - $ref: '#/components/schemas/TvShowItem'
        - $ref: '#/components/schemas/MotorcycleItem'
        - $ref: '#/components/schemas/CarItem'
        - $ref: '#/components/schemas/CameraItem'
      discriminator:
        propertyName: kind
        mapping:
          generic: '#/components/schemas/GenericItem'
          movie: '#/components/schemas/MovieItem'
          tv_show: '#/components/schemas/TvShowItem'
          motorcycle: '#/components/schemas/MotorcycleItem'
          car: '#/components/schemas/CarItem'
          camera: '#/components/schemas/CameraItem'
    ItemSummary:
      type: object
      description: "An item row in lists and search: no `metadata`, and the image is reduced."
      required: [id, list_id, title, kind, summary, status, image, price, official_website_url, content_version, sort_order, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        list_id: { type: string, format: uuid }
        title: { type: string }
        kind: { $ref: '#/components/schemas/ItemKind' }
        summary: { type: string, nullable: true }
        status: { type: string, nullable: true }
        image: { $ref: '#/components/schemas/ImageSummary' }
        price: { $ref: '#/components/schemas/Price' }
        official_website_url: { type: string, nullable: true }
        content_version: { type: integer }
        sort_order: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ItemPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ItemSummary' }
        page: { $ref: '#/components/schemas/Page' }
    SearchResult:
      type: object
      required: [item, path]
      properties:
        item: { $ref: '#/components/schemas/ItemSummary' }
        path:
          type: array
          items: { $ref: '#/components/schemas/PathSegment' }
    SearchPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        page: { $ref: '#/components/schemas/Page' }
    CreateItemRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        kind: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$', default: generic, description: 'One of the `ItemKind` values; validated in Go.' }
        summary: { type: string, nullable: true, maxLength: 1000 }
        status: { type: string, nullable: true, maxLength: 100 }
        price: { $ref: '#/components/schemas/Price' }
        official_website_url: { type: string, nullable: true, maxLength: 2048 }
        metadata:
          type: object
          description: 'Free-form here because `kind` may be absent. Validated per kind: see the `*Metadata` schemas.'
          additionalProperties: true
    UpdateItemRequest:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        kind: { type: string, pattern: '^[a-z][a-z0-9_]{0,31}$' }
        summary: { type: string, nullable: true, maxLength: 1000 }
        status: { type: string, nullable: true, maxLength: 100 }
        price: { $ref: '#/components/schemas/Price' }
        official_website_url: { type: string, nullable: true, maxLength: 2048 }
        metadata:
          type: object
          description: 'Free-form here because `kind` may be absent. Validated per kind: see the `*Metadata` schemas.'
          additionalProperties: true
    MoveItemRequest:
      type: object
      additionalProperties: false
      required: [list_id]
      properties:
        list_id: { type: string, format: uuid }
    ReorderItemsRequest:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
    # ---- Kind metadata (DATA_MODEL §2.1). All keys optional; text is trimmed, max 100 chars unless noted. ----
    Streaming:
      type: object
      additionalProperties: false
      required: [country]
      properties:
        country: { type: string, pattern: '^[A-Z]{2}$', description: ISO 3166-1 alpha-2. }
        platforms:
          type: array
          maxItems: 30
          description: Unique case-insensitively.
          items: { type: string, maxLength: 60 }
    GenericMetadata:
      type: object
      description: Must be `{}`.
      additionalProperties: false
      maxProperties: 0
    MovieMetadata:
      type: object
      additionalProperties: false
      properties:
        release_year: { type: integer, minimum: 1870, maximum: 2100 }
        runtime_minutes: { type: integer, minimum: 1, maximum: 1000 }
        imdb_url: { type: string, pattern: '^https://(www\.|m\.)?imdb\.com/title/tt\d{7,10}/?$' }
        streaming: { $ref: '#/components/schemas/Streaming' }
    TvShowMetadata:
      type: object
      additionalProperties: false
      properties:
        first_air_year: { type: integer, minimum: 1920, maximum: 2100 }
        end_year: { type: integer, minimum: 1920, maximum: 2100, description: 'At least `first_air_year`. Absent = ongoing.' }
        seasons: { type: integer, minimum: 1, maximum: 200 }
        imdb_url: { type: string, pattern: '^https://(www\.|m\.)?imdb\.com/title/tt\d{7,10}/?$' }
        streaming: { $ref: '#/components/schemas/Streaming' }
    MotorcycleMetadata:
      type: object
      additionalProperties: false
      properties:
        make: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        model_year: { type: integer, minimum: 1885, maximum: 2100 }
        segment: { type: string, maxLength: 50, description: 'E.g. naked, adventure, sport-touring.' }
        displacement_cc: { type: integer, minimum: 1, maximum: 5000 }
        power_hp: { type: number, minimum: 0, maximum: 1000, description: One decimal. }
        torque_nm: { type: number, minimum: 0, maximum: 1000, description: One decimal. }
        wet_weight_kg: { type: integer, minimum: 1, maximum: 1000 }
        seat_height_mm: { type: integer, minimum: 300, maximum: 1200 }
        license_class: { type: string, enum: [AM, A1, A2, A] }
    CarMetadata:
      type: object
      additionalProperties: false
      properties:
        make: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        trim: { type: string, maxLength: 100 }
        model_year: { type: integer, minimum: 1885, maximum: 2100 }
        body_type: { type: string, maxLength: 50, description: 'E.g. hatchback, SUV, estate.' }
        fuel_type: { type: string, enum: [petrol, diesel, hybrid, plugin_hybrid, electric, lpg, cng, hydrogen, other] }
        transmission: { type: string, enum: [manual, automatic] }
        power_hp: { type: number, minimum: 0, maximum: 2000, description: One decimal. }
        seats: { type: integer, minimum: 1, maximum: 9 }
        electric_range_km: { type: integer, minimum: 1, maximum: 2000, description: Only allowed when `fuel_type` is `electric` or `plugin_hybrid` (or absent). }
    CameraMetadata:
      type: object
      additionalProperties: false
      properties:
        make: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        release_year: { type: integer, minimum: 1900, maximum: 2100 }
        camera_type: { type: string, enum: [mirrorless, dslr, compact, rangefinder, medium_format, film, action, other] }
        sensor_format: { type: string, enum: [full_frame, aps_c, micro_four_thirds, one_inch, medium_format, film_35mm, other] }
        megapixels: { type: number, minimum: 0.1, maximum: 500, description: One decimal. }
        lens_mount: { type: string, maxLength: 50, description: 'E.g. Sony E, Fujifilm X.' }
        weight_g: { type: integer, minimum: 1, maximum: 10000 }
    # ---- Image requests ----
    UploadImageRequest:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: "JPEG, PNG or WebP, up to 10 MiB." }
    SetImageUrlRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: An https URL. }
    # ---- Content ----
    Content:
      type: object
      required: [item_id, version, body, updated_at]
      properties:
        item_id: { type: string, format: uuid }
        version: { type: integer, minimum: 0, description: 0 = never saved. }
        body: { type: string, description: "Markdown source, up to 1 MiB UTF-8." }
        updated_at: { type: string, format: date-time, nullable: true, description: When this version was saved. `null` for version 0. }
    UpdateContentRequest:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, maxLength: 1048576, description: Up to 1 MiB UTF-8 (the server checks bytes). }
    RestoreContentRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    ContentVersionInfo:
      type: object
      required: [version, size_bytes, created_at]
      properties:
        version: { type: integer, minimum: 1 }
        size_bytes: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
    ContentVersionList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ContentVersionInfo' }
    # ---- Trash ----
    TrashEntry:
      type: object
      required: [id, root_type, root_id, root_name, former_path, deleted_at, counts, restorable_in_place]
      properties:
        id: { type: string, format: uuid, description: The trash batch ID. }
        root_type: { type: string, enum: [folder, list, item] }
        root_id: { type: string, format: uuid }
        root_name: { type: string }
        former_path:
          type: array
          items: { $ref: '#/components/schemas/PathSegment' }
        deleted_at: { type: string, format: date-time }
        counts:
          type: object
          required: [folders, lists, items]
          properties:
            folders: { type: integer }
            lists: { type: integer }
            items: { type: integer }
        restorable_in_place: { type: boolean, description: False when the original parent is trashed or gone. }
    TrashPage:
      type: object
      required: [data, page]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/TrashEntry' }
        page: { $ref: '#/components/schemas/Page' }
    RestoreTrashRequest:
      type: object
      additionalProperties: false
      properties:
        destination:
          type: object
          additionalProperties: false
          description: '`folder_id` for a folder or list root (`null` = workspace root), `list_id` for an item root.'
          properties:
            folder_id: { type: string, format: uuid, nullable: true }
            list_id: { type: string, format: uuid }
    RestoreResult:
      type: object
      required: [root_type, root_id]
      properties:
        root_type: { type: string, enum: [folder, list, item] }
        root_id: { type: string, format: uuid }
