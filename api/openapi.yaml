            - "null"
        list_id:
          format: uuid
          type: string
      type: object
    RestoreResult:
      additionalProperties: false
      properties:
        root_id:
          format: uuid
          type: string
        root_type:
          enum:
            - folder
            - list
            - item
          type: string
      required:
        - root_id
        - root_type
      type: object
    RestoreTrashRequest:
      additionalProperties: false
      properties:
        destination:
          $ref: "#/components/schemas/RestoreDestination"
