openapi: 3.0.3
info:
  title: Collection App API
  version: 0.1.0
  description: |
    Private REST API of the Collection App (design-docs/API.md). There is no auth in the MVP, so it must stay on a private network.

    **Conventions**
    - Bodies are JSON (`application/json`) unless noted. Field names are `snake_case`, IDs are UUIDs, timestamps are RFC 3339 UTC.
    - Money is a decimal string with 2 decimals (`"1299.00"`).
    - Unknown request fields return `400 unknown_field`. `PATCH` is a partial update: send `null` explicitly to clear a nullable field. `PUT` replaces a sub-resource.
    - Create returns `201` with the resource and a `Location` header. Delete and purge return `204`.
    - Every response to a `GET` of a single resource, and to a mutation that returns one, carries an `ETag` header.
    - **Every response carries an `X-Request-Id` header** (set by middleware, so it is not repeated on each operation).

    **Optimistic concurrency.** ETags are typed and derived from `version`: folder `"f-N"`, list `"l-N"`, item `"i-N"`,
    content `"c-N"`, settings `"s-N"`. Operations marked *requires `If-Match`* answer `428 precondition_required` when the header is
    missing (or is `*`) and `412 version_conflict` (with `current_version`) when it is stale. Creates, the three `…/order` endpoints and
    trash restore/purge do not take `If-Match`.

    **Errors** are RFC 9457 `application/problem+json` with a stable `code` (see the `Problem` schema). A missing **or trashed** resource is
    `404 not_found` on every non-trash endpoint.

    **Limits.** JSON bodies: 64 KiB (2 MiB on the content `PUT`). Multipart image upload: 10 MiB plus 64 KiB overhead. Markdown: 1 MiB UTF-8.
    Item pages: `limit` 1–200 (default 50), `offset` ≥ 0.
servers:
  - url: /
tags:
  - name: health
    description: Liveness and readiness probes (outside `/api/v1`).
  - name: settings
    description: Workspace name and settings (one resource, one ETag).
  - name: tree
    description: The sidebar tree of active folders and lists.
  - name: folders
    description: Folders, their moves and ordering.
  - name: lists
    description: Lists, their moves and ordering.
  - name: items
    description: Items and their metadata.
  - name: image
    description: Item images (upload or URL) and attachment files.
  - name: content
    description: Markdown content of an item and its version history.
  - name: search
    description: Title search across all active items.
  - name: trash
    description: Deleted folders, lists and items, addressed by trash batch.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: checkHealth
      summary: Liveness probe
      description: 200 if the process is up.
      responses:
        '200':
          description: The process is up
          content:
            text/plain:
              schema: { type: string }
              examples:
                ok: { value: ok }
  /readyz:
    get:
      tags: [health]
      operationId: checkReadiness
      summary: Readiness probe
      description: 200 if the database is reachable and `DATA_DIR` is writable, else 503.
      responses:
        '200':
          description: Ready
          content:
            text/plain:
              schema: { type: string }
              examples:
                ready: { value: ready }
        '503':
          description: Database or storage unavailable
          content:
            text/plain:
              schema: { type: string }
              examples:
                database: { value: database unavailable }
  /api/v1/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Get workspace settings
      responses:
        '200':
          description: The settings, including the workspace name
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
              examples:
                default: { $ref: '#/components/examples/Settings' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [settings]
      operationId: updateSettings
      summary: Update workspace settings
      description: |
        Requires `If-Match` (`"s-N"`). Lowering `markdown_history_limit` prunes on the next save per item, not immediately.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSettingsRequest' }
            examples:
              rename:
                value: { workspace_name: Our Collection, markdown_history_limit: 30 }
      responses:
        '200':
          description: The updated settings
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
              examples:
                default: { $ref: '#/components/examples/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tree:
    get:
      tags: [tree]
      operationId: getTree
      summary: Get the sidebar tree
      description: All **active** folders and lists, flat and unpaginated. The client builds the tree.
      responses:
        '200':
          description: Active folders and lists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tree' }
              examples:
                default: { $ref: '#/components/examples/Tree' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/folders:
    post:
      tags: [folders]
      operationId: createFolder
      summary: Create a folder
      description: Appended to the end of its siblings. `parent_folder_id` absent or `null` creates it at the root. A missing or trashed parent returns `409 destination_unavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolderRequest' }
            examples:
              nested:
                value: { name: Movies, parent_folder_id: 7c1e5a10-0000-4000-8000-000000000001 }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
              examples:
                default: { $ref: '#/components/examples/Folder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/DestinationUnavailable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/folders/order:
    put:
      tags: [folders]
      operationId: reorderFolders
      summary: Reorder the child folders of a parent
      description: |
        `ids` must be **all** active child folders of `parent_folder_id` (`null` = root), in the new order. A set mismatch returns
        `409 order_stale`. No `If-Match`. Sibling versions are not bumped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderFoldersRequest' }
            examples:
              root:
                value:
                  parent_folder_id: null
                  ids: [7c1e5a10-0000-4000-8000-000000000002, 7c1e5a10-0000-4000-8000-000000000001]
      responses:
        '204': { description: Reordered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OrderStale' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/folders/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [folders]
      operationId: getFolder
      summary: Get a folder
      responses:
        '200':
          description: The folder
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
              examples:
                default: { $ref: '#/components/examples/Folder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [folders]
      operationId: updateFolder
      summary: Rename a folder
      description: Requires `If-Match` (`"f-N"`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateFolderRequest' }
            examples:
              rename: { value: { name: Films } }
      responses:
        '200':
          description: The updated folder
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
              examples:
                default: { $ref: '#/components/examples/Folder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [folders]
      operationId: deleteFolder
      summary: Move a folder and its subtree to the trash
      description: Requires `If-Match` (`"f-N"`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Moved to the trash }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/folders/{id}/move:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [folders]
      operationId: moveFolder
      summary: Move a folder under another parent
      description: |
        Requires `If-Match` (`"f-N"`). `parent_folder_id: null` moves it to the root. The folder is appended to the end of the new
        siblings and its `version` is bumped. Moving into itself or a descendant returns `409 cycle_detected`; a missing or trashed
        destination returns `409 destination_unavailable`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveFolderRequest' }
            examples:
              toRoot: { value: { parent_folder_id: null } }
      responses:
        '200':
          description: The moved folder
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Folder' }
              examples:
                default: { $ref: '#/components/examples/Folder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/FolderMoveConflict' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/lists:
    post:
      tags: [lists]
      operationId: createList
      summary: Create a list
      description: Appended to the end of its siblings. `folder_id` absent or `null` creates it at the root. A missing or trashed folder returns `409 destination_unavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListRequest' }
            examples:
              watchlist:
                value:
                  name: Watchlist
                  folder_id: 7c1e5a10-0000-4000-8000-000000000001
                  description: Films to watch
                  display_mode: thumbnail
                  sort_mode: manual
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
              examples:
                default: { $ref: '#/components/examples/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/DestinationUnavailable' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/lists/order:
    put:
      tags: [lists]
      operationId: reorderLists
      summary: Reorder the child lists of a folder
      description: |
        `ids` must be **all** active child lists of `folder_id` (`null` = root), in the new order. A set mismatch returns
        `409 order_stale`. No `If-Match`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderListsRequest' }
            examples:
              inFolder:
                value:
                  folder_id: 7c1e5a10-0000-4000-8000-000000000001
                  ids: [7c1e5a10-0000-4000-8000-000000000012, 7c1e5a10-0000-4000-8000-000000000011]
      responses:
        '204': { description: Reordered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OrderStale' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/lists/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [lists]
      operationId: getList
      summary: Get a list
      description: Includes `path` (the ancestor folders).
      responses:
        '200':
          description: The list
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
              examples:
                withPath: { $ref: '#/components/examples/ListWithPath' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [lists]
      operationId: updateList
      summary: Update a list
      description: 'Requires `If-Match` (`"l-N"`). Send `description: null` to clear it.'
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateListRequest' }
            examples:
              viewMode: { value: { display_mode: grid, sort_mode: title } }
      responses:
        '200':
          description: The updated list
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
              examples:
                default: { $ref: '#/components/examples/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [lists]
      operationId: deleteList
      summary: Move a list and its items to the trash
      description: Requires `If-Match` (`"l-N"`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Moved to the trash }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/lists/{id}/move:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [lists]
      operationId: moveList
      summary: Move a list to another folder
      description: |
        Requires `If-Match` (`"l-N"`). `folder_id: null` moves it to the root. Appended to the end of the new siblings.
        A missing or trashed destination returns `409 destination_unavailable`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveListRequest' }
            examples:
              toFolder: { value: { folder_id: 7c1e5a10-0000-4000-8000-000000000002 } }
      responses:
        '200':
          description: The moved list
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/List' }
              examples:
                default: { $ref: '#/components/examples/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DestinationUnavailable' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/lists/{id}/items:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [items]
      operationId: listItems
      summary: List the items of a list
      description: "Sorted by `sort` (default: the list's `sort_mode`), tie-break `id`. `q` filters by title."
      parameters:
        - name: sort
          in: query
          description: Defaults to the list's `sort_mode`.
          schema: { type: string, enum: [manual, title, updated] }
        - name: q
          in: query
          description: Case-insensitive title filter.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of item summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemPage' }
              examples:
                default: { $ref: '#/components/examples/ItemPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [items]
      operationId: createItem
      summary: Create an item
      description: |
        Appended to the end of the list. `kind` defaults to `generic`. Image and Markdown content are set through their own endpoints
        after creation. `metadata` is validated per kind (see the `*Metadata` schemas).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
            examples:
              movie:
                value:
                  title: The Matrix
                  kind: movie
                  summary: A hacker learns the truth about reality.
                  status: Watched
                  price: null
                  official_website_url: https://www.warnerbros.com/movies/matrix
                  metadata:
                    release_year: 1999
                    runtime_minutes: 136
                    imdb_url: https://www.imdb.com/title/tt0133093/
                    streaming: { country: IT, platforms: [Netflix, Prime Video] }
      responses:
        '201':
          description: Created
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
              examples:
                movie: { $ref: '#/components/examples/ItemMovie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/lists/{id}/items/order:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [items]
      operationId: reorderListItems
      summary: Reorder the items of a list
      description: |
        `ids` must be **all** active items of the list, in the new order. Allowed regardless of `sort_mode`. A set mismatch returns
        `409 order_stale`. No `If-Match`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderItemsRequest' }
            examples:
              two:
                value: { ids: [7c1e5a10-0000-4000-8000-000000000102, 7c1e5a10-0000-4000-8000-000000000101] }
      responses:
        '204': { description: Reordered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OrderStale' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [items]
      operationId: getItem
      summary: Get an item
      description: Includes `path` (the ancestor folders and the list).
      responses:
        '200':
          description: The item
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
              examples:
                movie: { $ref: '#/components/examples/ItemMovieWithPath' }
                motorcycle: { $ref: '#/components/examples/ItemMotorcycle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [items]
      operationId: updateItem
      summary: Update an item
      description: |
        Requires `If-Match` (`"i-N"`). Any of `title, kind, summary, status, price, official_website_url, metadata`; send `null` to clear
        a nullable field. If `kind` changes and `metadata` is absent, metadata resets to `{}`. Image changes go through the image endpoints.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
            examples:
              price:
                value: { status: Owned, price: { min: '12000.00', max: '13500.00', currency: EUR } }
      responses:
        '200':
          description: The updated item
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
              examples:
                motorcycle: { $ref: '#/components/examples/ItemMotorcycle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [items]
      operationId: deleteItem
      summary: Move an item to the trash
      description: Requires `If-Match` (`"i-N"`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Moved to the trash }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/items/{id}/move:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [items]
      operationId: moveItem
      summary: Move an item to another list
      description: Requires `If-Match` (`"i-N"`). Appended to the end of the destination list. A missing or trashed list returns `409 destination_unavailable`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveItemRequest' }
            examples:
              toList: { value: { list_id: 7c1e5a10-0000-4000-8000-000000000012 } }
      responses:
        '200':
          description: The moved item
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
              examples:
                motorcycle: { $ref: '#/components/examples/ItemMotorcycle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DestinationUnavailable' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/items/{id}/image:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [image]
      operationId: setItemImage
      summary: Set the item image (upload or URL)
      description: |
        Requires `If-Match` (`"i-N"`). Replaces any existing image of either source. Send **either** `multipart/form-data` with a `file`
        field (up to 10 MiB, JPEG/PNG/WebP detected by content sniffing, SVG always rejected) **or** JSON `{ "url": "https://…" }`.
        Returns the updated item.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/UploadImageRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/SetImageUrlRequest' }
            examples:
              url: { value: { url: 'https://image.tmdb.org/t/p/w500/matrix.jpg' } }
      responses:
        '200':
          description: The updated item
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
              examples:
                upload: { $ref: '#/components/examples/ItemMovie' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [image]
      operationId: deleteItemImage
      summary: Remove the item image
      description: Requires `If-Match` (`"i-N"`). Returns the updated item.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: The updated item
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
              examples:
                motorcycle: { $ref: '#/components/examples/ItemMotorcycle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/attachments/{id}/file:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [image]
      operationId: getAttachmentFile
      summary: Download the original image
      description: A replacement always creates a new attachment ID, so the response is cacheable forever.
      responses:
        '200':
          description: The original image
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCacheControl' }
          content:
            image/jpeg: { schema: { $ref: '#/components/schemas/BinaryFile' } }
            image/png: { schema: { $ref: '#/components/schemas/BinaryFile' } }
            image/webp: { schema: { $ref: '#/components/schemas/BinaryFile' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/attachments/{id}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [image]
      operationId: getAttachmentThumbnail
      summary: Download the JPEG thumbnail
      description: Longest side 640 px. Same caching as the original.
      responses:
        '200':
          description: The thumbnail
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCacheControl' }
          content:
            image/jpeg: { schema: { $ref: '#/components/schemas/BinaryFile' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/items/{id}/content:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [content]
      operationId: getItemContent
      summary: Get the current Markdown content
      description: Version 0 with an empty body if the item was never saved.
      responses:
        '200':
          description: The current content
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
              examples:
                saved: { $ref: '#/components/examples/Content' }
                empty: { $ref: '#/components/examples/ContentEmpty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [content]
      operationId: updateItemContent
      summary: Save the Markdown content
      description: |
        Requires `If-Match` (`"c-N"`, the current content version). The body is at most 1 MiB UTF-8. An identical body returns 200 with the
        same version. Bumps the item's `updated_at` but not its `version`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContentRequest' }
            examples:
              notes: { value: { body: "# Notes\n\nGreat film, rewatch in 4K." } }
      responses:
        '200':
          description: The saved content
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
              examples:
                saved: { $ref: '#/components/examples/Content' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/items/{id}/content/versions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [content]
      operationId: listContentVersions
      summary: List the saved content versions
      description: Newest first, unpaginated (at most 201).
      responses:
        '200':
          description: The version list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentVersionList' }
              examples:
                default: { $ref: '#/components/examples/ContentVersionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/items/{id}/content/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Version'
    get:
      tags: [content]
      operationId: getContentVersion
      summary: Get one content version (for preview)
      description: Returns 404 if that version never existed or was pruned. The `ETag` is that version's (`"c-N"`).
      responses:
        '200':
          description: The content of that version
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
              examples:
                saved: { $ref: '#/components/examples/Content' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/items/{id}/content/restore:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [content]
      operationId: restoreContentVersion
      summary: Restore an older content version
      description: |
        Requires `If-Match` (`"c-N"`, the **current** version). Creates a new version with the body of `version` and returns it.
        404 if that version was pruned.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreContentRequest' }
            examples:
              v1: { value: { version: 1 } }
      responses:
        '200':
          description: The new current content
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Content' }
              examples:
                saved: { $ref: '#/components/examples/Content' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/VersionConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/search:
    get:
      tags: [search]
      operationId: searchItems
      summary: Search items by title
      description: Case-insensitive substring match. Exact matches first, then alphabetical.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of matches with their paths
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
              examples:
                default: { $ref: '#/components/examples/SearchPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/trash:
    get:
      tags: [trash]
      operationId: listTrash
      summary: List trash entries
      description: One entry per user-initiated delete, newest first.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of trash entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrashPage' }
              examples:
                default: { $ref: '#/components/examples/TrashPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/trash/{batch_id}/restore:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    post:
      tags: [trash]
      operationId: restoreTrashBatch
      summary: Restore a trash batch
      description: |
        No `If-Match`. The body is optional. Without a destination the root returns to its original parent; if that parent is trashed or
        gone the call returns `409 parent_in_trash` (with `blocking_parent`). With a destination the root is re-parented and appended
        to the end: `destination.folder_id` for folders and lists (`null` = root), `destination.list_id` for items.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreTrashRequest' }
            examples:
              toRoot: { value: { destination: { folder_id: null } } }
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreResult' }
              examples:
                default: { value: { root_type: list, root_id: 7c1e5a10-0000-4000-8000-000000000012 } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/RestoreConflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/trash/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    delete:
      tags: [trash]
      operationId: purgeTrashBatch
      summary: Purge a trash batch permanently
      description: Deletes the subtree and its files. No `If-Match`.
      responses:
        '204': { description: Purged }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource ID.
      schema: { type: string, format: uuid }
    BatchId:
      name: batch_id
      in: path
      required: true
      description: Trash batch ID (`TrashEntry.id`).
      schema: { type: string, format: uuid }
    Version:
      name: version
      in: path
      required: true
      description: Content version number.
      schema: { type: integer, minimum: 1 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        **Required.** The typed ETag of the resource being changed (`"i-7"`, `"c-3"`, …). Declared optional only so the generated server
        does not answer 400 itself: a missing header (or `*`) returns `428 precondition_required`, a stale one `412 version_conflict`.
      schema: { type: string, maxLength: 64 }
      example: '"i-7"'
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      description: Number of rows to skip.
      schema: { type: integer, minimum: 0, default: 0 }
  headers:
    ETag:
      description: Typed ETag derived from `version` (`"f-N"`, `"l-N"`, `"i-N"`, `"c-N"`, `"s-N"`). Use it as `If-Match`.
      required: true
      schema: { type: string }
      example: '"i-3"'
    Location:
      description: URL of the created resource.
      required: true
      schema: { type: string }
      example: /api/v1/items/7c1e5a10-0000-4000-8000-000000000101
    ImmutableCacheControl:
      description: Always `private, max-age=31536000, immutable`.
      required: true
      schema: { type: string }
      example: private, max-age=31536000, immutable
  responses:
    BadRequest:
      description: Malformed JSON, unknown field or invalid path/query parameter
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            malformed_request:
              value:
                type: https://collection-app.invalid/problems/malformed-request
                title: Malformed request
                status: 400
                detail: The request body is not valid JSON.
                code: malformed_request
            unknown_field:
              value:
                type: https://collection-app.invalid/problems/unknown-field
                title: Unknown field
                status: 400
                detail: 'Unknown field "colour".'
                code: unknown_field
            invalid_parameter:
              value:
                type: https://collection-app.invalid/problems/invalid-parameter
                title: Invalid parameter
                status: 400
                detail: '"limit" must be between 1 and 200.'
                code: invalid_parameter
    NotFound:
      description: The resource is missing or trashed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            not_found:
              value:
                type: https://collection-app.invalid/problems/not-found
                title: Not found
                status: 404
                detail: Item not found.
                code: not_found
    FolderMoveConflict:
      description: The destination is the folder itself or a descendant, or is missing or trashed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            cycle_detected:
              value:
                type: https://collection-app.invalid/problems/cycle-detected
                title: Cycle detected
                status: 409
                detail: A folder cannot be moved into itself or one of its descendants.
                code: cycle_detected
            destination_unavailable:
              value:
                type: https://collection-app.invalid/problems/destination-unavailable
                title: Destination unavailable
                status: 409
                detail: The destination folder does not exist or is in the trash.
                code: destination_unavailable
    DestinationUnavailable:
      description: The destination folder or list is missing or trashed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            destination_unavailable:
              value:
                type: https://collection-app.invalid/problems/destination-unavailable
                title: Destination unavailable
                status: 409
                detail: The destination folder or list does not exist or is in the trash.
                code: destination_unavailable
    OrderStale:
      description: '`ids` is not exactly the current set of active siblings'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            order_stale:
              value:
                type: https://collection-app.invalid/problems/order-stale
                title: Order is stale
                status: 409
                detail: The list of items changed. Reload and try again.
                code: order_stale
    RestoreConflict:
      description: The original parent is in the trash (or gone), or the chosen destination is unusable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/RestoreConflictProblem' }
          examples:
            parent_in_trash:
              value:
                type: https://collection-app.invalid/problems/parent-in-trash
                title: Parent is in the trash
                status: 409
                detail: Restore the parent first, or choose a destination.
                code: parent_in_trash
                blocking_parent:
                  type: folder
                  id: 7c1e5a10-0000-4000-8000-000000000003
                  name: Vehicles
            destination_unavailable:
              value:
                type: https://collection-app.invalid/problems/destination-unavailable
                title: Destination unavailable
                status: 409
                detail: The destination folder does not exist or is in the trash.
                code: destination_unavailable
            cycle_detected:
              value:
                type: https://collection-app.invalid/problems/cycle-detected
                title: Cycle detected
                status: 409
                detail: A folder cannot be restored into itself or one of its descendants.
                code: cycle_detected
    VersionConflict:
      description: '`If-Match` is stale'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/VersionConflictProblem' }
          examples:
            version_conflict:
              value:
                type: https://collection-app.invalid/problems/version-conflict
                title: Resource was modified
                status: 412
                detail: Item was changed by someone else.
                code: version_conflict
                current_version: 8
    PayloadTooLarge:
      description: JSON body over the route limit, Markdown over 1 MiB, or image over 10 MiB
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            payload_too_large:
              value:
                type: https://collection-app.invalid/problems/payload-too-large
                title: Payload too large
                status: 413
                detail: The request body exceeds the limit for this route.
                code: payload_too_large
    UnsupportedMediaType:
      description: The upload is not a JPEG, PNG or WebP image (SVG is always rejected)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unsupported_media_type:
              value:
                type: https://collection-app.invalid/problems/unsupported-media-type
                title: Unsupported media type
                status: 415
                detail: Only JPEG, PNG and WebP images are accepted.
                code: unsupported_media_type
    ValidationFailed:
      description: A field rule was violated
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
          examples:
            validation_failed:
              value:
                type: https://collection-app.invalid/problems/validation-failed
                title: Validation failed
                status: 422
                detail: One or more fields are invalid.
                code: validation_failed
                errors:
                  - { field: price.max, message: must be greater than or equal to price.min }
    PreconditionRequired:
      description: '`If-Match` is missing (or `*`)'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            precondition_required:
              value:
                type: https://collection-app.invalid/problems/precondition-required
                title: Precondition required
                status: 428
                detail: Send the resource ETag in the If-Match header.
                code: precondition_required
    InternalError:
      description: Unexpected server error. Never contains SQL, paths or stack traces
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            internal:
              value:
                type: https://collection-app.invalid/problems/internal
                title: Internal error
                status: 500
                detail: Something went wrong.
                code: internal
                request_id: 5b0c1d52-7f10-4e0e-9a55-3b2d3c0f6a11
  examples:
    Settings:
      value:
        workspace_name: Our Collection
        streaming_country_code: IT
        default_currency: EUR
        markdown_history_limit: 20
        version: 4
    Folder:
      value:
        id: 7c1e5a10-0000-4000-8000-000000000002
        parent_folder_id: 7c1e5a10-0000-4000-8000-000000000001
        name: Movies
        sort_order: 0
        version: 1
        created_at: '2026-10-14T09:30:00Z'
        updated_at: '2026-10-14T09:30:00Z'
    List:
      value:
        id: 7c1e5a10-0000-4000-8000-000000000011
        folder_id: 7c1e5a10-0000-4000-8000-000000000002
        name: Watchlist
        description: Films to watch
        display_mode: thumbnail
        sort_mode: manual
        sort_order: 0
        item_count: 2
        version: 1
        created_at: '2026-10-14T09:30:00Z'
        updated_at: '2026-10-14T09:30:00Z'
    ListWithPath:
      value:
        id: 7c1e5a10-0000-4000-8000-000000000011
        folder_id: 7c1e5a10-0000-4000-8000-000000000002
        name: Watchlist
        description: Films to watch
        display_mode: thumbnail
        sort_mode: manual
        sort_order: 0
        item_count: 2
        version: 1
        created_at: '2026-10-14T09:30:00Z'
        updated_at: '2026-10-14T09:30:00Z'
        path:
          - { type: folder, id: 7c1e5a10-0000-4000-8000-000000000001, name: Media }
          - { type: folder, id: 7c1e5a10-0000-4000-8000-000000000002, name: Movies }
    Tree:
      value:
        folders:
          - id: 7c1e5a10-0000-4000-8000-000000000001
            parent_folder_id: null
            name: Media
            sort_order: 0
            version: 1
            created_at: '2026-10-14T09:00:00Z'
            updated_at: '2026-10-14T09:00:00Z'
          - id: 7c1e5a10-0000-4000-8000-000000000002
            parent_folder_id: 7c1e5a10-0000-4000-8000-000000000001
            name: Movies
            sort_order: 0
            version: 1
