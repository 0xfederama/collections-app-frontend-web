# Release image (D-116, D-117): every vX.Y.Z tag builds the production web image (Caddy + built SPA)
# for linux/arm64 only (the Pi and the dev Macs are arm64) on a native arm64 runner, no QEMU, and pushes it to GHCR (private package). A tag is not a deploy:
# publishing a GitHub Release (latest) is the prod approval, and the Pi pulls from there.
name: release-image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Manual run: builds the image without pushing (timing and smoke checks).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/collections-app-frontend-web
          tags: |
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
